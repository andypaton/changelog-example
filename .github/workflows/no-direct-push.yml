name: Prevent Direct Push

on:
  push:
    branches:
      - main

jobs:
  block-direct-push:
    name: Block Direct Push to Main
    runs-on: ubuntu-latest

    steps:
      - name: Fail if not from PR merge
        run: |
          if [ "${{ github.event.pusher.name }}" != "github-actions[bot]" ]; then
            echo "❌ Direct pushes to main are not allowed"
            exit 1
          fi